name: finance-reconciliation-airflow

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: finance-reconciliation-airflow:3.3.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg://airflow:airflow@airflow-postgres:5432/airflow

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: >-
      http://airflow-api-server:8080/execution/

    AIRFLOW__API_AUTH__JWT_SECRET: >-
      finance-reconciliation-local-airflow-jwt-secret

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    FINANCE_RECON_PROJECT_ROOT: >-
      /opt/airflow/project

    FINANCE_RECON_CONTAINER_HOST: >-
      host.docker.internal

  user: "${AIRFLOW_UID:-50000}:0"

  # host.docker.internal only resolves out of the box on Docker
  # Desktop (macOS/Windows); this makes it resolve on Linux hosts too,
  # which run_finance_recon.py needs to reach the finance-reconciliation
  # Postgres published by the main docker-compose.yml.
  extra_hosts:
    - "host.docker.internal:host-gateway"

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    # Full repo, at the same path the image installs
    # finance-reconciliation from (see airflow/Dockerfile). Gives
    # run_finance_recon.py / finance-recon access to generator/,
    # data/generated, .env, etc. via PROJECT_ROOT resolution.
    - .:/opt/airflow/project


services:
  airflow-postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

    restart: unless-stopped


  airflow-init:
    <<: *airflow-common

    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow db check
        airflow version

    depends_on:
      airflow-postgres:
        condition: service_healthy

    restart: "no"


  airflow-api-server:
    <<: *airflow-common

    command: api-server

    ports:
      - "127.0.0.1:8081:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    depends_on:
      airflow-postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped


  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    depends_on:
      airflow-postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped


  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    depends_on:
      airflow-postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped


volumes:
  airflow-postgres-data: