name: Finance Reconciliation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI only checks out, builds, and tests. It never writes back.
permissions:
  contents: read

# One in-flight run per pull request / branch. A new push to a PR
# cancels the superseded run; pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Repository contract
        run: make validate-contract

  finance-integration:
    name: finance-integration
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (dbt + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dbt,dev]"

      - name: Local development environment
        run: |
          cp .env.example .env
          make dbt-profile

      # M0-M5 clean + with_anomalies acceptance against a fresh
      # docker-compose PostgreSQL. Uses the deterministic ECB fixture,
      # never the live ECB feed.
      - name: Finance reconciliation acceptance (M0-M5)
        run: make m5-acceptance

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail 200 postgres || true

      - name: Teardown
        if: always()
        run: docker compose down -v || true

  airflow-integration:
    name: airflow-integration
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Local development environment
        run: |
          cp .env.example .env
          make dbt-profile

      - name: Build Airflow image
        run: make airflow-build

      # Business PostgreSQL clean room + Airflow runtime, then runtime
      # health, DAG contract, and two real DAG runs with RAW idempotency
      # and clean-reconciliation checks (Commit 34).
      - name: Airflow workflow acceptance
        run: make airflow-workflow-acceptance

      - name: Diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.airflow.yml ps -a || true
          docker compose ps -a || true
          docker compose -f docker-compose.airflow.yml logs --tail 200 \
            airflow-api-server airflow-scheduler airflow-dag-processor || true

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.airflow.yml down -v --remove-orphans || true
          docker compose down -v || true
