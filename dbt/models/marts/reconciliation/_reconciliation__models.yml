version: 2

models:
  - name: fct_payment_reconciliation
    description: >
      One row per successful PSP capture combining Billing invoice,
      product, PSP lifecycle, settlement, reference FX, and accounting
      context. The fact exposes reconciliation control outcomes and
      differences without expanding them into individual exception rows.

    columns:
      - name: capture_id
        description: PSP CAPTURE financial event identifier.
        data_tests:
          - not_null
          - unique

      - name: invoice_id
        description: Billing invoice associated with the capture.
        data_tests:
          - not_null

      - name: product_id
        description: Product identifier reported by Billing.

      - name: is_product_mapped
        description: >
          True when the Billing product identifier resolves to the
          product staging model.

      - name: invoice_total_amount
        description: Billing invoice total in invoice currency.

      - name: capture_amount
        description: PSP captured amount in transaction currency.

      - name: capture_amount_eur
        description: >
          Capture value translated to management EUR using the selected
          as-of ECB reference FX rate.

      - name: invoice_capture_count
        description: Number of PSP captures associated with the invoice.

      - name: capture_currency_matches_invoice
        description: >
          True when Billing invoice currency and PSP capture currency
          agree.

      - name: capture_minus_invoice_amount
        description: >
          PSP capture amount minus Billing invoice total when currencies
          agree.

      - name: capture_amount_matches_invoice
        description: >
          True when Billing invoice and PSP capture currencies and
          amounts agree.

      - name: settlement_item_count
        description: Number of PSP settlement items referencing the capture.

      - name: settlement_count
        description: Number of distinct PSP settlement batches for the capture.

      - name: settlement_delay_days
        description: >
          Calendar days from capture date to an unambiguously matched
          settlement date.

      - name: psp_fx_rate_variance_ratio
        description: >
          Relative variance between PSP settlement FX and the selected
          ECB reference FX.

      - name: is_fx_rate_outlier
        description: >
          True when absolute PSP-vs-reference FX variance exceeds the
          configured reconciliation FX threshold. Null when the
          comparison cannot be performed.

      - name: posted_journal_entry_count
        description: Number of POSTED accounting entries referencing the capture.

      - name: ledger_debit_minus_expected_amount_eur
        description: >
          Posted expected-account debit minus management-EUR capture
          value.

      - name: ledger_credit_minus_expected_amount_eur
        description: >
          Posted expected-account credit minus management-EUR capture
          value.

      - name: is_ledger_amount_within_tolerance
        description: >
          True when both expected accounting legs are within the
          configured EUR reconciliation tolerance. Null when there is
          not exactly one posted journal entry or reference FX is
          unavailable.

      - name: posted_journal_balance_difference_eur
        description: >
          Debit-minus-credit balance difference of the posted accounting
          entry.

      - name: is_journal_balanced_within_tolerance
        description: >
          True when the accounting journal balance difference is within
          the configured EUR reconciliation tolerance.

  - name: fct_settlement_reconciliation
    description: >
      One row per PSP settlement combining settlement-header values,
      aggregated settlement-item values, bank receipt context, and
      accounting posting context. The fact applies configured finance
      tolerances to expose settlement, bank, and ledger control outcomes
      without expanding them into individual reconciliation exceptions.

    columns:
      - name: settlement_id
        description: PSP settlement identifier.
        data_tests:
          - not_null
          - unique

      - name: settlement_date
        description: PSP settlement business date.
        data_tests:
          - not_null

      - name: settlement_currency
        description: PSP settlement payout currency.

      - name: gross_amount
        description: PSP settlement header gross amount.

      - name: fee_amount
        description: PSP settlement header processing fee amount.

      - name: net_payout_amount
        description: PSP settlement header net payout amount.

      - name: settlement_status
        description: PSP settlement lifecycle status.

      - name: settlement_item_count
        description: Number of PSP settlement items belonging to the batch.

      - name: settled_financial_event_count
        description: Number of distinct PSP financial events in the settlement.

      - name: item_gross_eur_amount
        description: Aggregated gross EUR amount from settlement items.

      - name: item_fee_eur_amount
        description: Aggregated fee EUR amount from settlement items.

      - name: item_net_eur_amount
        description: Aggregated net EUR amount from settlement items.

      - name: gross_header_minus_items_amount
        description: >
          PSP settlement header gross amount minus aggregated settlement
          item gross amount.

      - name: fee_header_minus_items_amount
        description: >
          PSP settlement header fee amount minus aggregated settlement
          item fee amount.

      - name: net_header_minus_items_amount
        description: >
          PSP settlement header net payout minus aggregated settlement
          item net amount.

      - name: is_settlement_total_within_tolerance
        description: >
          True when gross, fee, and net settlement header values all
          agree with aggregated settlement items within the configured
          EUR reconciliation tolerance.

      - name: bank_reference_match_count
        description: >
          Number of bank statement rows carrying the settlement bank
          reference.

      - name: eligible_bank_receipt_count
        description: >
          Number of matching BOOKED EUR CREDIT bank transactions.

      - name: bank_transaction_id
        description: >
          Bank transaction identifier when exactly one eligible receipt
          exists.

      - name: bank_amount
        description: >
          Booked EUR credit amount when exactly one eligible receipt
          exists.

      - name: bank_delay_days
        description: >
          Calendar days from PSP settlement date to matched bank booking
          date.

      - name: bank_minus_settlement_amount
        description: >
          Matched bank amount minus PSP net payout amount.

      - name: is_bank_amount_within_tolerance
        description: >
          True when exactly one eligible bank receipt exists and its
          amount agrees with the PSP net payout within the configured
          EUR tolerance. Null when the bank match is missing or
          ambiguous.

      - name: journal_entry_match_count
        description: >
          Number of accounting journal entries referencing the
          settlement.

      - name: posted_journal_entry_count
        description: >
          Number of POSTED accounting journal entries referencing the
          settlement.

      - name: ledger_bank_debit_eur_amount
        description: Posted debit to account 1100 BANK.

      - name: ledger_fee_debit_eur_amount
        description: Posted debit to account 6100 PAYMENT_PROCESSING_FEES.

      - name: ledger_psp_clearing_credit_eur_amount
        description: Posted credit to account 1200 PSP_CLEARING.

      - name: ledger_bank_minus_expected_amount_eur
        description: >
          Posted BANK debit minus PSP settlement net payout.

      - name: ledger_fee_minus_expected_amount_eur
        description: >
          Posted processing-fee debit minus PSP settlement fee.

      - name: ledger_clearing_minus_expected_amount_eur
        description: >
          Posted PSP-clearing credit minus PSP settlement gross amount.

      - name: is_ledger_amount_within_tolerance
        description: >
          True when the BANK, processing-fee, and PSP-clearing ledger
          legs all agree with the PSP settlement amounts within the
          configured EUR tolerance. Null when there is not exactly one
          posted accounting entry.

      - name: posted_journal_balance_difference_eur
        description: >
          Debit-minus-credit difference for the matched posted journal.

      - name: is_journal_balanced_within_tolerance
        description: >
          True when the posted journal balance difference is within the
          configured EUR reconciliation tolerance.

  - name: mart_reconciliation_exceptions
    description: >
      One row per reconciliation exception across invoice, PSP
      financial-event, capture, settlement, bank, reference FX, product
      mapping, and accounting controls. The mart converts reconciliation
      facts into deterministic exception codes, statuses, severities,
      and EUR exposure measures using the configured finance-control
      policy and deterministic as-of date.

    columns:
      - name: exception_id
        description: >
          Deterministic exception identifier built from exception code,
          entity type, and entity identifier.
        data_tests:
          - not_null
          - unique

      - name: exception_code
        description: Finance reconciliation exception taxonomy code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - MISSING_CAPTURE
                  - CAPTURE_AMOUNT_MISMATCH
                  - DUPLICATE_CAPTURE
                  - INVALID_REFUND
                  - OVER_REFUND
                  - MISSING_SETTLEMENT
                  - LATE_SETTLEMENT
                  - SETTLEMENT_TOTAL_MISMATCH
                  - MISSING_BANK_RECEIPT
                  - BANK_AMOUNT_MISMATCH
                  - MISSING_LEDGER_POSTING
                  - LEDGER_AMOUNT_MISMATCH
                  - UNBALANCED_JOURNAL
                  - MISSING_FX_RATE
                  - FX_RATE_OUTLIER
                  - UNMAPPED_PRODUCT

      - name: exception_status
        description: Current reconciliation lifecycle status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - RECONCILED
                  - PENDING
                  - OPEN_BREAK
                  - RESOLVED
                  - EXCLUDED

      - name: severity
        description: Finance-control severity.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - INFO
                  - WARNING
                  - CRITICAL

      - name: entity_type
        description: Grain/entity on which the exception was detected.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - INVOICE
                  - CAPTURE
                  - FINANCIAL_EVENT
                  - SETTLEMENT

      - name: entity_id
        description: Identifier of the affected finance entity.
        data_tests:
          - not_null

      - name: business_date
        description: Business date associated with the affected entity.
        data_tests:
          - not_null

      - name: as_of_date
        description: >
          Deterministic control-evaluation date used for aging-based
          PENDING and OPEN_BREAK decisions.
        data_tests:
          - not_null

      - name: product_id
        description: Billing product identifier when meaningful for the exception.

      - name: product_name
        description: Product name when the Billing product resolves.

      - name: product_family
        description: Product family when the Billing product resolves.

      - name: currency
        description: Currency associated with the affected finance object.

      - name: exception_amount_eur
        description: >
          Non-negative EUR magnitude associated with the exception when
          it can be measured reliably. Null when EUR exposure cannot be
          safely determined, for example because reference FX is missing.

      - name: age_days
        description: >
          Calendar-day age or observed delay used by aging-based controls
          when applicable.

      - name: observed_amount_eur
        description: Observed EUR amount when a single comparable value exists.

      - name: expected_amount_eur
        description: Expected EUR amount when a single comparable value exists.

      - name: difference_amount_eur
        description: >
          Signed observed-minus-expected EUR difference when meaningful.

      - name: control_source
        description: >
          Finance model or control context from which the exception was
          derived.

  - name: mart_finance_daily
    description: >
      Daily Finance reporting mart at business-date, product, and
      currency grain. The mart combines invoice activity, payment
      lifecycle values, capture-level reconciliation status, and
      reconciliation exception metrics. Settlement-level exceptions
      without a defensible product allocation are retained with a null
      product identifier.

    columns:
      - name: business_date
        description: Finance business date for the aggregated activity.
        data_tests:
          - not_null

      - name: product_id
        description: >
          Billing product identifier when activity can be attributed to
          a product. Null for unallocated settlement-level activity.

      - name: product_name
        description: Product name when product_id resolves.

      - name: product_family
        description: Product family when product_id resolves.

      - name: currency
        description: Transaction or settlement currency for the daily row.
        data_tests:
          - not_null

      - name: invoice_count
        description: Number of Billing invoices issued on the business date.

      - name: invoice_total_amount
        description: >
          Total Billing invoice amount in the row currency.

      - name: capture_count
        description: Number of successful PSP captures on the business date.

      - name: capture_amount
        description: Total captured amount in the row currency.

      - name: valued_capture_amount_eur
        description: >
          Total capture amount with an available management-EUR
          valuation.

      - name: unvalued_capture_count
        description: >
          Number of captures for which management-EUR value cannot be
          calculated, for example because reference FX is missing.

      - name: refund_amount
        description: Total positive refund amount in the row currency.

      - name: valued_refund_amount_eur
        description: Refund amount with available management-EUR valuation.

      - name: chargeback_amount
        description: Total positive chargeback amount in the row currency.

      - name: valued_chargeback_amount_eur
        description: Chargeback amount with available management-EUR valuation.

      - name: net_payment_amount
        description: >
          Capture amount after refunds and chargebacks in the row
          transaction currency.

      - name: valued_net_payment_amount_eur
        description: Net payment value with available management-EUR valuation.

      - name: reconciled_capture_count
        description: >
          Number of captures with no active PENDING, OPEN_BREAK, or
          EXCLUDED reconciliation exception.

      - name: pending_capture_count
        description: Number of captures whose current reconciliation status is PENDING.

      - name: open_break_capture_count
        description: Number of captures whose current reconciliation status is OPEN_BREAK.

      - name: excluded_capture_count
        description: Number of captures excluded by reconciliation policy.

      - name: reconciled_capture_amount_eur
        description: >
          Management-EUR value of captures currently classified as
          reconciled.

      - name: pending_capture_amount_eur
        description: Management-EUR value of captures currently pending.

      - name: open_break_capture_amount_eur
        description: Management-EUR value of captures with active breaks.

      - name: excluded_capture_amount_eur
        description: Management-EUR value of excluded captures.

      - name: amount_reconciliation_rate
        description: >
          Reconciled management-EUR capture amount divided by total
          management-EUR-valued capture amount. Null when the daily
          denominator is zero.

      - name: exception_count
        description: Number of reconciliation exception rows for the daily grain.

      - name: pending_exception_count
        description: Number of PENDING reconciliation exceptions.

      - name: open_break_exception_count
        description: Number of OPEN_BREAK reconciliation exceptions.

      - name: resolved_exception_count
        description: Number of RESOLVED reconciliation exceptions.

      - name: critical_exception_count
        description: Number of CRITICAL reconciliation exceptions.

      - name: warning_exception_count
        description: Number of WARNING reconciliation exceptions.

      - name: info_exception_count
        description: Number of INFO reconciliation exceptions.

      - name: gross_exception_amount_eur
        description: >
          Sum of exception-level EUR magnitudes. This is gross control
          exposure and is not deduplicated across multiple exception
          types affecting the same economic amount.

      - name: open_break_exception_amount_eur
        description: >
          Gross EUR control exposure associated with OPEN_BREAK
          exception rows.

      - name: pending_exception_amount_eur
        description: >
          Gross EUR control exposure associated with PENDING exception
          rows.