name: finance_reconciliation
version: 1.0.0
config-version: 2

profile: finance_reconciliation

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: target

clean-targets:
  - target
  - dbt_packages

models:
  finance_reconciliation:

    staging:
      +materialized: view

    intermediate:
      +materialized: view

    marts:
      +materialized: table

vars:
  reconciliation_amount_tolerance_eur: 0.01
  reconciliation_settlement_pending_days: 5
  reconciliation_bank_pending_days: 2
  reconciliation_fx_outlier_ratio: 0.03
  reconciliation_as_of_date: "2026-01-31"