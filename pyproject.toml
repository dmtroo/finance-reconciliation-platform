[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "finance-reconciliation-platform"
version = "0.1.0"
description = "Production-like finance reconciliation data pipeline portfolio project"
requires-python = ">=3.11,<3.14"

dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "typer>=0.15,<1",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1,<2",
  "openpyxl>=3.1,<4",
]


[project.optional-dependencies]
dbt = [
  "dbt-postgres>=1.10,<2",
]

dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["finance_reconciliation*"]
namespaces = false


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py311"


[project.scripts]
finance-recon = "finance_reconciliation.cli:main"